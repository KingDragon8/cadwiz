name: Mac first-run network diagnosis
on:
  push:
    branches: ["codex/pre-release-connection-hardening"]
    paths: ["scripts/ci/mac_network_probe.py", "scripts/ci/network_audit/**", ".github/workflows/mac-network-diagnostic.yml"]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      # Full FreeCAD-runtime and GUI baseline is retained in run45894559112.
      # This follow-up isolates the host Python that runs the SDK tests.
      - name: Capture permission state after each host Python network phase
        run: python scripts/ci/mac_network_probe.py --host-python --output "$RUNNER_TEMP/mac-network-probe"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-first-run-network-evidence
          path: |
            ${{ runner.temp }}/mac-network-probe/
