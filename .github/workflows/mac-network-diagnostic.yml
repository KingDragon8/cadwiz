name: Mac first-run network diagnosis
on:
  push:
    branches: ["codex/pre-release-connection-hardening"]
    paths: ["scripts/ci/mac_network_probe.py", "scripts/ci/network_audit/**", ".github/workflows/mac-network-diagnostic.yml"]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Verified official FreeCAD runtime
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          file=FreeCAD_1.1.4-macOS-arm64-py311.dmg
          base=https://github.com/FreeCAD/FreeCAD/releases/download/1.1.4
          curl --retry 3 --max-time 900 -fsSL "$base/$file" -o "$file"
          curl --retry 3 -fsSL "$base/$file-SHA256.txt" -o sums.txt
          test "$(shasum -a 256 "$file" | awk '{print $1}')" = "$(awk '{print $1; exit}' sums.txt)"
          mkdir mount
          hdiutil attach "$file" -readonly -nobrowse -mountpoint "$RUNNER_TEMP/mount"
          app=$(find "$RUNNER_TEMP/mount" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app"
          ditto "$app" "$RUNNER_TEMP/FreeCAD.app"
          hdiutil detach "$RUNNER_TEMP/mount"
      - name: Capture permission state after each native network phase
        run: python scripts/ci/mac_network_probe.py --python "$RUNNER_TEMP/FreeCAD.app/Contents/Resources/bin/python" --output "$RUNNER_TEMP/mac-network-probe"
      - name: Trace installed GUI and worker networking without granting permissions
        run: python scripts/ci/macos_install_acceptance.py --app "$RUNNER_TEMP/FreeCAD.app" --output "$RUNNER_TEMP/mac-acceptance" --network-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-first-run-network-evidence
          path: |
            ${{ runner.temp }}/mac-network-probe/
            ${{ runner.temp }}/mac-acceptance/
