# CADWiz checks. None of them calls a paid AI service, and none needs a secret.
name: checks

on:
  pull_request:
  push:
    branches: [main, "release/**"]

permissions:
  contents: read

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/ci/check_dco.py "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  secrets:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git . --redact --no-banner

  tests:
    name: Lint, imports, tests, connector handshake
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Claude extension
        run: npx --yes @anthropic-ai/mcpb@2.1.2 validate CADWiz/Resources/claude-extension/manifest.json
      - name: Verify bundled helper offline in a private folder
        env:
          CADWIZ_SETUP_DIR: ${{ runner.temp }}/cadwiz-offline-proof
        run: python CADWiz/src/integrations/cadwiz_plugin/offline_launcher.py --check
      - run: python -m pip install pytest "mcp==1.27.0" pillow ruff
      - name: Lint (real mistakes only)
        run: python -m ruff check CADWiz/src scripts tests
      - name: Network calls are all allow-listed
        run: python scripts/ci/check_egress_allowlist.py
      - name: Every module imports
        run: python scripts/ci/import_every_module.py
      - name: Tests (includes the MCP handshake with the connector)
        run: python -m pytest

  freecad:
    name: FreeCAD loads the addon (no window)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: FreeCAD 1.1.4 AppImage (the latest release)
        run: |
          curl -sSfL -o FreeCAD.AppImage https://github.com/FreeCAD/FreeCAD/releases/download/1.1.4/FreeCAD_1.1.4-Linux-x86_64-py311.AppImage
          chmod +x FreeCAD.AppImage
          ./FreeCAD.AppImage --appimage-extract > /dev/null
      - name: Verify the offline helper with FreeCAD's Python
        env:
          CADWIZ_SETUP_DIR: ${{ runner.temp }}/cadwiz-freecad-proof
        run: squashfs-root/usr/bin/python CADWiz/src/integrations/cadwiz_plugin/offline_launcher.py --check
      - name: Load check
        # The result file is shown whether the check passes or fails.
        run: |
          set +e
          squashfs-root/usr/bin/freecadcmd scripts/ci/freecad_load_check.py
          status=$?
          cat freecad-load-check.txt 2>/dev/null || echo "freecad-load-check.txt was not written"
          exit $status
      - name: Native parametric construction, mutation and persistence
        run: squashfs-root/usr/bin/freecadcmd scripts/ci/native_parametric_check.py
      - name: Synthetic herringbone geometry and editable history
        run: squashfs-root/usr/bin/freecadcmd scripts/ci/herringbone_benchmark.py
      - name: Production session and sandbox acceptance
        run: squashfs-root/usr/bin/freecadcmd scripts/ci/native_session_check.py

  windows-installer:
    name: Windows Setup.exe lifecycle (FreeCAD 1.1.4)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download and verify official native tools
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'cadwiz-native-tools'
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          $compiler = Join-Path $tools 'innosetup.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $compiler
          if ((Get-FileHash $compiler).Hash.ToLowerInvariant() -ne '8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0') { throw 'Compiler checksum mismatch' }
          $compilerDir = Join-Path $tools 'InnoSetup'
          $process = Start-Process $compiler -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/SP-','/NORESTART','/CURRENTUSER',('/DIR="' + $compilerDir + '"'),'/NOICONS') -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Compiler installation failed' }
          $archive = Join-Path $tools 'FreeCAD.7z'
          Invoke-WebRequest 'https://github.com/FreeCAD/FreeCAD/releases/download/1.1.4/FreeCAD_1.1.4-Windows-x86_64-py311.7z' -OutFile $archive
          if ((Get-FileHash $archive).Hash.ToLowerInvariant() -ne '4828741fc91ee37fafcdb97a1abacb18b04ba451ac4372d9ff7a7349b36f4d6d') { throw 'FreeCAD checksum mismatch' }
          & "$env:ProgramFiles\7-Zip\7z.exe" x $archive "-o$tools" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'FreeCAD extraction failed' }
          # Expose the verified portable files at the normal 64-bit Program Files
          # convention on this disposable hosted VM. Never create this on an owner PC.
          $autoPath = Join-Path $env:ProgramFiles 'FreeCAD CADWiz QA 1.1.4'
          if (Test-Path -LiteralPath $autoPath) { throw 'Unexpected existing automatic-detection fixture' }
          New-Item -ItemType Junction -Path $autoPath -Target (Join-Path $tools 'FreeCAD_1.1.4-Windows-x86_64-py311') | Out-Null
          "CADWIZ_TEST_FREECAD_BIN=$tools\FreeCAD_1.1.4-Windows-x86_64-py311\bin" | Out-File $env:GITHUB_ENV -Append
          "CADWIZ_INNO_COMPILER=$compilerDir\ISCC.exe" | Out-File $env:GITHUB_ENV -Append
      - name: Build the committed customer installer
        run: python scripts/release/build_windows_installer.py --compiler "$env:CADWIZ_INNO_COMPILER" --output windows-release
      - name: Install, upgrade, uninstall and recover using native FreeCAD
        run: python scripts/ci/windows_installer_acceptance.py --freecad-bin "$env:CADWIZ_TEST_FREECAD_BIN" --installer windows-release/CADWiz-Setup-0.9.3.exe --output windows-acceptance --autodetect
      - name: Native Windows shell regressions must not skip
        run: |
          python -m pip install pytest
          python -m pytest tests/test_windows_native_arguments.py --junitxml=windows-shell.xml
            if ($LASTEXITCODE -ne 0) { throw 'Windows shell tests failed' }
            python -c "import xml.etree.ElementTree as E; r=E.parse('windows-shell.xml'); assert all(int(s.get(k,'0'))==0 for s in r.iter('testsuite') for k in ('skipped','failures','errors')), 'Windows shell tests skipped or failed'"
      - name: Native Windows parametric checks
        run: |
          & "$env:CADWIZ_TEST_FREECAD_BIN\python.exe" scripts/ci/native_parametric_check.py
          if ($LASTEXITCODE -ne 0) { throw 'Native parametric check failed' }
          & "$env:CADWIZ_TEST_FREECAD_BIN\python.exe" scripts/ci/native_session_check.py
          if ($LASTEXITCODE -ne 0) { throw 'Native session check failed' }
      - name: Synthetic herringbone benchmark
        run: |
          & "$env:CADWIZ_TEST_FREECAD_BIN\python.exe" scripts/ci/herringbone_benchmark.py
          if ($LASTEXITCODE -ne 0) { throw 'Herringbone benchmark failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer-acceptance
          path: |
            windows-acceptance/
            windows-release/Setup-build.json
            windows-release/Setup-build.log
            windows-release/*.exe
            windows-shell.xml
