# CADWiz checks. None of them calls a paid AI service, and none needs a secret.
name: checks

on:
  pull_request:
  push:
    branches: [main, "release/**"]

permissions:
  contents: read

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/ci/check_dco.py "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  secrets:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git . --redact --no-banner

  tests:
    name: Lint, imports, tests, connector handshake
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Claude extension
        run: npx --yes @anthropic-ai/mcpb@2.1.2 validate CADWiz/Resources/claude-extension/manifest.json
      - name: Verify bundled helper offline in a private folder
        env:
          CADWIZ_SETUP_DIR: ${{ runner.temp }}/cadwiz-offline-proof
        run: python CADWiz/src/integrations/cadwiz_plugin/offline_launcher.py --check
      - run: python -m pip install pytest "mcp==1.27.0" pillow ruff
      - name: Lint (real mistakes only)
        run: python -m ruff check CADWiz/src scripts tests
      - name: Network calls are all allow-listed
        run: python scripts/ci/check_egress_allowlist.py
      - name: Every module imports
        run: python scripts/ci/import_every_module.py
      - name: Tests (includes the MCP handshake with the connector)
        run: python -m pytest

  freecad:
    name: FreeCAD loads the addon (no window)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: FreeCAD 1.1.4 AppImage (the latest release)
        run: |
          curl -sSfL -o FreeCAD.AppImage https://github.com/FreeCAD/FreeCAD/releases/download/1.1.4/FreeCAD_1.1.4-Linux-x86_64-py311.AppImage
          chmod +x FreeCAD.AppImage
          ./FreeCAD.AppImage --appimage-extract > /dev/null
      - name: Verify the offline helper with FreeCAD's Python
        env:
          CADWIZ_SETUP_DIR: ${{ runner.temp }}/cadwiz-freecad-proof
        run: squashfs-root/usr/bin/python CADWiz/src/integrations/cadwiz_plugin/offline_launcher.py --check
      - name: Load check
        # The result file is shown whether the check passes or fails.
        run: |
          set +e
          squashfs-root/usr/bin/freecadcmd scripts/ci/freecad_load_check.py
          status=$?
          cat freecad-load-check.txt 2>/dev/null || echo "freecad-load-check.txt was not written"
          exit $status
