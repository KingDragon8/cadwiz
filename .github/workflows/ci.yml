# CADWiz checks. None of them calls a paid AI service, and none needs a secret.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/ci/check_dco.py "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  secrets:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git . --redact --no-banner

  tests:
    name: Lint, imports, tests, connector handshake
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest "mcp==1.27.0" pillow ruff
      - name: Lint (real mistakes only)
        run: python -m ruff check CADWiz/src scripts tests
      - name: Network calls are all allow-listed
        run: python scripts/ci/check_egress_allowlist.py
      - name: Every module imports
        run: python scripts/ci/import_every_module.py
      - name: Tests (includes the MCP handshake with the connector)
        run: python -m pytest

  freecad:
    name: FreeCAD loads the addon (no window)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: FreeCAD 1.1.3 AppImage
        run: |
          curl -sSfL -o FreeCAD.AppImage https://github.com/FreeCAD/FreeCAD/releases/download/1.1.3/FreeCAD_1.1.3-Linux-x86_64-py311.AppImage
          chmod +x FreeCAD.AppImage
          ./FreeCAD.AppImage --appimage-extract > /dev/null
      - name: Install the connector's one package into FreeCAD's Python
        run: squashfs-root/usr/bin/python -m pip install --user "mcp==1.27.0"
      - name: Load check
        run: squashfs-root/usr/bin/freecadcmd scripts/ci/freecad_load_check.py && cat freecad-load-check.txt
