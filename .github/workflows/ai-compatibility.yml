name: AI connection compatibility
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-vault:
    name: Native credential vault (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest 'mcp==1.27.0'
      - name: Linux disposable Secret Service dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libsecret-tools gnome-keyring dbus-x11
      - name: Disposable macOS test keychain (no provider accounts)
        if: runner.os == 'macOS'
        run: |
          security create-keychain -p cadwiz-disposable-test-password "$RUNNER_TEMP/cadwiz-test.keychain-db"
          security default-keychain -s "$RUNNER_TEMP/cadwiz-test.keychain-db"
          security unlock-keychain -p cadwiz-disposable-test-password "$RUNNER_TEMP/cadwiz-test.keychain-db"
      - name: Native Windows or macOS vault and connection regressions
        if: runner.os != 'Linux'
        run: python -m pytest tests/test_ai_compatibility_093.py --junitxml=ai-compatibility.xml
      - name: Native Linux vault in an isolated D-Bus session
        if: runner.os == 'Linux'
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/cadwiz-vault
          CADWIZ_NATIVE_SECRET_SERVICE: '1'
        run: |
          mkdir -p "$XDG_DATA_HOME"
          dbus-run-session -- bash -c 'printf "cadwiz-disposable-test-password" | gnome-keyring-daemon --unlock --components=secrets; python -m pytest tests/test_ai_compatibility_093.py --junitxml=ai-compatibility.xml'
      - name: Assert native vault was exercised
        run: python -c "import xml.etree.ElementTree as E; r=E.parse('ai-compatibility.xml'); cases=[c for c in r.iter('testcase') if c.get('name')=='test_native_os_vault_roundtrip']; assert len(cases)==1 and not list(cases[0]), 'Native vault test was skipped or failed'"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-compatibility-${{ matrix.os }}
          path: ai-compatibility.xml
