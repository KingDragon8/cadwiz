[project]
name = "cadwiz"
version = "0.5.0b2"
description = "CADWiz: a FreeCAD addon that lets Claude Desktop see, measure, build and edit your models"
license = "LGPL-2.1-or-later"
requires-python = ">=3.11"
readme = "README.md"

[project.optional-dependencies]
test = ["pytest>=8,<10", "mcp==1.27.0", "pillow>=10"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
pythonpath = ["CADWiz/src", "CADWiz/vendor/robust-mcp/src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 130
src = ["CADWiz/src", "tests"]
extend-exclude = ["CADWiz/vendor"]

[tool.ruff.lint]
# The release gate checks for real mistakes (undefined names, broken imports,
# syntax); style is not enforced on the beta.
select = ["E9", "F63", "F7", "F82"]
